<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Threshare · 计数回归</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: dark; }
  body { margin:0; padding:20px; background:#0B0D10; color:#E7E9EA;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  h1 { font-size:14px; font-weight:700; margin:0 0 6px; }
  .sub { font-size:12px; color:#71767B; margin-bottom:14px; line-height:1.6; }
  #report { background:#15181C; border-radius:12px; padding:14px; margin-bottom:16px;
    font-family: ui-monospace, Consolas, monospace; font-size:12px; line-height:1.7; white-space:pre-wrap; }
  .ok { color:#00BA7C; } .bad { color:#F4212E; }
  #stage { display:flex; gap:20px; flex-wrap:wrap; }
  #stage canvas { display:block; max-width:320px; height:auto; border-radius:12px; }
  #fixture { position:absolute; left:-9999px; }
</style>
</head>
<body>
<h1>Threshare · 计数回归</h1>
<div class="sub">
  Threads 在 2026-11 把图标从「评论」改成了「回复」/「已回复」。<br>
  旧的 <code>/评论/</code> 匹配不到，导致 actionRow 返回 null，<b>整行计数全丢</b>。<br>
  另外互动为 0 的帖子原本不显示统计行，看起来也像坏了。
</div>
<div id="report">loading…</div>
<div id="stage"></div>

<div id="fixture">
  <!-- A：新叫法「回复」+ 有数字 -->
  <div data-pressable-container="true" data-case="reply-new">
    <div>
      <div><a href="/@u1"><img alt="u1的头像" width="36" height="36"
        src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"></a></div>
      <div>
        <a href="/@u1"><span dir="auto">u1</span></a>
        <a href="/@u1/post/A1"><time datetime="2026-11-12T00:00:00.000Z"><span>1小时</span></time></a>
      </div>
      <div><div><span dir="auto">测试正文 A</span></div></div>
      <div class="row">
        <div role="button"><svg><title>赞</title></svg><span dir="auto">12</span></div>
        <div role="button"><svg><title>回复</title></svg><span dir="auto">3</span></div>
        <div role="button"><svg><title>转发</title></svg><span dir="auto">5</span></div>
        <div role="button"><svg><title>分享</title></svg><span dir="auto">2</span></div>
      </div>
    </div>
  </div>

  <!-- B：更怪的「已回复」 -->
  <div data-pressable-container="true" data-case="replied">
    <div>
      <div><a href="/@u2"><img alt="u2的头像" width="36" height="36"
        src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"></a></div>
      <div>
        <a href="/@u2"><span dir="auto">u2</span></a>
        <a href="/@u2/post/B2"><time datetime="2026-11-12T00:00:00.000Z"><span>2小时</span></time></a>
      </div>
      <div><div><span dir="auto">测试正文 B</span></div></div>
      <div class="row">
        <div role="button"><svg><title>赞</title></svg></div>
        <div role="button"><svg><title>已回复</title></svg><span dir="auto">1</span></div>
        <div role="button"><svg><title>转发</title></svg></div>
        <div role="button"><svg><title>分享</title></svg></div>
      </div>
    </div>
  </div>

  <!-- C：旧叫法「评论」（向后兼容） -->
  <div data-pressable-container="true" data-case="comment-legacy">
    <div>
      <div><a href="/@u3"><img alt="u3的头像" width="36" height="36"
        src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"></a></div>
      <div>
        <a href="/@u3"><span dir="auto">u3</span></a>
        <a href="/@u3/post/C3"><time datetime="2026-11-12T00:00:00.000Z"><span>3小时</span></time></a>
      </div>
      <div><div><span dir="auto">测试正文 C</span></div></div>
      <div class="row">
        <div role="button"><svg><title>赞</title></svg><span dir="auto">1,234</span></div>
        <div role="button"><svg><title>评论</title></svg><span dir="auto">56</span></div>
        <div role="button"><svg><title>转发</title></svg><span dir="auto">7</span></div>
        <div role="button"><svg><title>分享</title></svg><span dir="auto">8</span></div>
      </div>
    </div>
  </div>

  <!-- D：全部 0（真实主页上的情形）—— 统计行仍须出现 -->
  <div data-pressable-container="true" data-case="all-zero">
    <div>
      <div><a href="/@u4"><img alt="u4的头像" width="36" height="36"
        src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"></a></div>
      <div>
        <a href="/@u4"><span dir="auto">u4</span></a>
        <a href="/@u4/post/D4"><time datetime="2026-11-12T00:00:00.000Z"><span>4小时</span></time></a>
      </div>
      <div><div><span dir="auto">测试正文 D 没有互动</span></div></div>
      <div class="row">
        <div role="button"><svg><title>赞</title></svg></div>
        <div role="button"><svg><title>回复</title></svg></div>
        <div role="button"><svg><title>转发</title></svg></div>
        <div role="button"><svg><title>分享</title></svg></div>
      </div>
    </div>
  </div>
</div>

<script src="../src/util.js"></script>
<script src="../src/extract.js"></script>
<script src="../src/qrcode.js"></script>
<script src="../src/render.js"></script>
<script>
const lines = [];
const log = (s, cls) => { lines.push(cls ? `<span class="${cls}">${s}</span>` : s);
  document.getElementById('report').innerHTML = lines.join('\n'); };
let pass = 0, fail = 0;
const check = (name, ok, detail) => {
  ok ? pass++ : fail++;
  log(`${ok ? '✓' : '✗'} ${name}${detail ? '  ' + detail : ''}`, ok ? 'ok' : 'bad');
};

(async () => {
  try {
    const conts = [...document.querySelectorAll('[data-pressable-container]')];
    log(`夹具 ${conts.length} 条\n`);

    const got = {};
    for (const c of conts) {
      const p = TS.extractPost(c);
      got[c.dataset.case] = p;
      log(`── ${c.dataset.case} ──`);
      log(`  counts: 赞${p.counts.like} 回复${p.counts.reply} 转发${p.counts.repost}`);
    }
    log('');

    // A：新叫法「回复」
    check('A 「回复」能解析', got['reply-new']?.counts.reply === 3,
      `实际 ${got['reply-new']?.counts.reply}`);
    check('A 赞/转发也正确',
      got['reply-new']?.counts.like === 12 && got['reply-new']?.counts.repost === 5,
      `赞${got['reply-new']?.counts.like} 转${got['reply-new']?.counts.repost}`);

    // B：「已回复」
    check('B 「已回复」能解析', got['replied']?.counts.reply === 1,
      `实际 ${got['replied']?.counts.reply}`);

    // C：旧叫法「评论」
    check('C 「评论」仍兼容', got['comment-legacy']?.counts.reply === 56,
      `实际 ${got['comment-legacy']?.counts.reply}`);
    check('C 千分位数字', got['comment-legacy']?.counts.like === 1234,
      `实际 ${got['comment-legacy']?.counts.like}`);

    // D：全 0 —— actionRow 仍须找得到（否则 0 是"匹配失败"而非真 0）
    check('D 全 0 时 actionRow 仍能定位', !!TS.actionRow(conts[3]),
      TS.actionRow(conts[3]) ? '找到' : '没找到');
    check('D 计数为 0', got['all-zero']?.counts.like === 0 && got['all-zero']?.counts.reply === 0);

    // 渲染：D 的统计行必须出现（3 个标签都在）
    log('');
    for (const c of conts) {
      const p = TS.extractPost(c);
      const { canvas, plan } = TS.renderPost(p, null, { avatar: null, media: [] }, 2);
      const texts = plan.ops.filter(o => o.kind === 'text').map(o => o.text);
      const hasStats = ['回复', '转发', '喜欢'].every(t => texts.includes(t));
      check(`渲染 ${c.dataset.case}: 统计行三项齐全`, hasStats,
        hasStats ? '' : `实际文本: ${texts.slice(0, 12).join('|')}`);
      document.getElementById('stage').appendChild(canvas);
    }

    log(`\n结果: ${pass} 通过 / ${fail} 失败`, fail ? 'bad' : 'ok');
    window.__COUNTS__ = { ok: fail === 0, pass, fail,
      counts: Object.fromEntries(Object.entries(got).map(([k,v]) => [k, v.counts])) };
  } catch (err) {
    log('✗ ' + err.message + '\n' + err.stack, 'bad');
    window.__COUNTS__ = { ok: false, error: err.message };
  }
})();
</script>
</body>
</html>
