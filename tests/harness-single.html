<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Threshare · 单图回归</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; padding:20px; background:#0B0D10; color:#E7E9EA;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  h1 { font-size:14px; font-weight:700; margin:0 0 6px; }
  .sub { font-size:12px; color:#71767B; margin-bottom:14px; line-height:1.6; }
  #report { background:#15181C; border-radius:12px; padding:14px; margin-bottom:16px;
    font-family: ui-monospace, Consolas, monospace; font-size:12px; line-height:1.7; white-space:pre-wrap; }
  .ok { color:#00BA7C; } .bad { color:#F4212E; } .warn { color:#FFD400; }
  #stage { display:flex; gap:20px; flex-wrap:wrap; }
  #stage canvas { display:block; max-width:320px; height:auto; border-radius:12px; }
  #fixture { position:absolute; left:-9999px; top:0; width:520px; }
</style>
</head>
<body>
<h1>Threshare · 单图回归</h1>
<div class="sub">
  单图帖的配图会被包进 <code>a[href="/@user/post/xxx/media"]</code>（点图看原图）。<br>
  旧代码见到 <code>&lt;a&gt;</code> 就当装饰性图片删掉，导致<b>单图不显示、多图正常</b>。<br>
  下面三种结构必须都能提取到图。
</div>
<div id="report">loading…</div>
<div id="stage"></div>

<div id="fixture">
  <!-- A：单图 + 外层 <a>（点图看原图）—— 曾经被误删 -->
  <div data-pressable-container="true" data-case="single-in-link">
    <div>
      <div><a href="/@userA"><img alt="userA的头像" width="36" height="36"
        src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"></a></div>
      <div>
        <a href="/@userA"><span dir="auto">userA</span></a>
        <a href="/@userA/post/AAA111"><time datetime="2026-11-11T00:00:00.000Z"><span>1小时</span></time></a>
      </div>
      <div>
        <a href="/@userA/post/AAA111/media">
          <picture>
            <img alt="" width="542" height="305" src="https://cdn.example/single-a.jpg">
          </picture>
        </a>
      </div>
      <div>
        <div role="button" aria-label="赞 10"><svg><title>赞</title></svg><span dir="auto">10</span></div>
        <div role="button" aria-label="评论 2"><svg><title>评论</title></svg><span dir="auto">2</span></div>
        <div role="button" aria-label="转发"><svg><title>转发</title></svg></div>
        <div role="button" aria-label="分享"><svg><title>分享</title></svg></div>
      </div>
    </div>
  </div>

  <!-- B：单图 + 无外层 <a> —— 一直正常，作为对照 -->
  <div data-pressable-container="true" data-case="single-plain">
    <div>
      <div><a href="/@userB"><img alt="userB的头像" width="36" height="36"
        src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"></a></div>
      <div>
        <a href="/@userB"><span dir="auto">userB</span></a>
        <a href="/@userB/post/BBB222"><time datetime="2026-11-11T00:00:00.000Z"><span>2小时</span></time></a>
      </div>
      <div><div><img alt="" width="640" height="342" src="https://cdn.example/single-b.jpg"></div></div>
      <div>
        <div role="button" aria-label="赞 5"><svg><title>赞</title></svg><span dir="auto">5</span></div>
        <div role="button" aria-label="评论 1"><svg><title>评论</title></svg><span dir="auto">1</span></div>
        <div role="button" aria-label="转发"><svg><title>转发</title></svg></div>
        <div role="button" aria-label="分享"><svg><title>分享</title></svg></div>
      </div>
    </div>
  </div>

  <!-- C：正文里带 emoji 贴纸（span 内 img）+ 一张配图 -->
  <div data-pressable-container="true" data-case="emoji-plus-photo">
    <div>
      <div><a href="/@userC"><img alt="userC的头像" width="36" height="36"
        src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"></a></div>
      <div>
        <a href="/@userC"><span dir="auto">userC</span></a>
        <a href="/@userC/post/CCC333"><time datetime="2026-11-11T00:00:00.000Z"><span>3小时</span></time></a>
      </div>
      <div>
        <div>
          <span dir="auto">今天好開心
            <span><img alt="" width="30" height="24" src="https://media1.giphy.com/x.gif"></span>
          </span>
        </div>
      </div>
      <div><div><img alt="" width="600" height="400" src="https://cdn.example/photo-c.jpg"></div></div>
      <div>
        <div role="button" aria-label="赞 7"><svg><title>赞</title></svg><span dir="auto">7</span></div>
        <div role="button" aria-label="评论 3"><svg><title>评论</title></svg><span dir="auto">3</span></div>
        <div role="button" aria-label="转发"><svg><title>转发</title></svg></div>
        <div role="button" aria-label="分享"><svg><title>分享</title></svg></div>
      </div>
    </div>
  </div>
</div>

<script src="../src/util.js"></script>
<script src="../src/extract.js"></script>
<script src="../src/qrcode.js"></script>
<script src="../src/render.js"></script>
<script>
const lines = [];
const log = (s, cls) => { lines.push(cls ? `<span class="${cls}">${s}</span>` : s);
  document.getElementById('report').innerHTML = lines.join('\n'); };

let pass = 0, fail = 0;
const check = (name, ok, detail) => {
  ok ? pass++ : fail++;
  log(`${ok ? '✓' : '✗'} ${name}${detail ? '  ' + detail : ''}`, ok ? 'ok' : 'bad');
};

(async () => {
  try {
    const conts = [...document.querySelectorAll('[data-pressable-container]')];
    log(`夹具帖子数: ${conts.length}\n`);

    const results = [];
    for (const c of conts) {
      const cse = c.dataset.case;
      const p = TS.extractPost(c);
      log(`── ${cse} ──`);
      log(`  正文 ${p.text.length} 字: ${p.text.slice(0, 40).replace(/\n/g, ' / ')}`);
      log(`  媒体 ${p.media.length} 个: ${p.media.map(m => m.src.split('/').pop()).join(', ') || '(无)'}`);
      results.push({ cse, media: p.media, text: p.text, post: p });
    }

    log('');
    // A：单图包在 <a> 里 → 必须提取到 1 张
    const A = results.find(r => r.cse === 'single-in-link');
    check('单图（外层 a 指向 /media）能提取', A && A.media.length === 1,
      `实际 ${A ? A.media.length : '?'} 张`);
    if (A && A.media.length) {
      check('  且是那张配图', /single-a\.jpg$/.test(A.media[0].src), A.media[0].src.split('/').pop());
    }

    // B：单图无外层 a → 1 张
    const B = results.find(r => r.cse === 'single-plain');
    check('单图（无外层 a）能提取', B && B.media.length === 1,
      `实际 ${B ? B.media.length : '?'} 张`);

    // C：emoji + 配图 → 只提取 1 张（不含 giphy）
    const C = results.find(r => r.cse === 'emoji-plus-photo');
    check('emoji + 配图：只留配图', C && C.media.length === 1 && !/giphy/.test(JSON.stringify(C.media)),
      `实际 ${C ? C.media.length : '?'} 张`);
    check('  正文含 emoji 且非空', C && C.text.length > 0, C ? `"${C.text.slice(0, 20)}"` : '');

    // 渲染一遍，确认单图真的画出来
    for (const r of results) {
      const { canvas, plan } = TS.renderPost(r.post, null, { avatar: null, media: [] }, 2);
      const imgOps = plan.ops.filter(o => o.kind === 'image').length;
      check(`  ${r.cse} 画出 ${imgOps} 格图`, imgOps === Math.min(r.media.length, 4),
        `期望 ${Math.min(r.media.length, 4)}`);
      document.getElementById('stage').appendChild(canvas);
    }

    log(`\n结果: ${pass} 通过 / ${fail} 失败`, fail ? 'bad' : 'ok');
    window.__SINGLE__ = { ok: fail === 0, pass, fail, results: results.map(r => ({ cse: r.cse, media: r.media.length, text: r.text.length })) };
  } catch (err) {
    log('✗ ' + err.message + '\n' + err.stack, 'bad');
    window.__SINGLE__ = { ok: false, error: err.message };
  }
})();
</script>
</body>
</html>
